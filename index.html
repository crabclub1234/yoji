<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101b33">
<title>四字熟語マス</title>
<style>
  :root{
    --ai-deep:#0d1729;
    --ai:#1b2c4e;
    --paper:#f5f1e6;
    --paper-line:#c9d3e4;
    --sumi:#1a1c22;
    --shu:#c4402c;
    --kin:#c9a75a;
    --mincho:"UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","Yu Kyokasho","YuKyokasho","Hiragino Mincho ProN","Yu Mincho",serif;
    --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--gothic);color:var(--paper);
    background:radial-gradient(120% 80% at 50% 0%, #22375e 0%, var(--ai) 45%, var(--ai-deep) 100%);
    background-attachment:fixed;
    display:flex;flex-direction:column;min-height:100dvh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 8px}
  .brand{font-family:var(--mincho);font-size:15px;letter-spacing:.28em;color:var(--kin)}
  .count{font-size:13px;font-variant-numeric:tabular-nums;color:#9fb2d0;letter-spacing:.06em}

  .row{display:flex;gap:6px;padding:0 16px 8px}
  .pill{
    flex:1;padding:9px 0;border-radius:999px;border:1px solid rgba(201,167,90,.35);
    background:transparent;color:#c3d0e6;font:inherit;font-size:13px;cursor:pointer;
    transition:background .15s,color .15s;
  }
  .pill[aria-pressed="true"]{background:var(--kin);color:#1b1405;border-color:var(--kin);font-weight:600}
  .pill:disabled{opacity:.4;cursor:default}
  .row.mode .pill{border-color:rgba(255,255,255,.18)}
  .row.mode .pill[aria-pressed="true"]{background:rgba(255,255,255,.9);color:#16203a;border-color:transparent}
  .pill:focus-visible,.grade:focus-visible,.card:focus-visible,.reset:focus-visible{outline:2px solid var(--kin);outline-offset:3px}

  main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 16px 8px}
  .card{display:block;width:100%;border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:center;cursor:pointer}
  .masu{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .box{
    position:relative;aspect-ratio:1/1;border-radius:3px;background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 0 rgba(0,0,0,.25);overflow:hidden;
  }
  .box::before,.box::after{content:"";position:absolute;background:var(--paper-line)}
  .box::before{left:8%;right:8%;height:1px;top:50%}
  .box::after{top:8%;bottom:8%;width:1px;left:50%}
  .box.filled::before,.box.filled::after{opacity:.35}
  .box span{position:relative;font-family:var(--mincho);font-weight:600;font-size:clamp(34px,13.5vw,60px);line-height:1;color:var(--sumi)}
  .box.hidden span{color:var(--shu)}
  .reveal .box.hidden span{animation:ink .32s ease-out both}
  @keyframes ink{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}

  .yomi{margin:18px 0 0;min-height:22px;font-size:16px;letter-spacing:.22em;color:var(--kin)}
  .imi{margin:10px auto 0;max-width:34em;min-height:3.2em;font-size:15.5px;line-height:1.75;color:#e7edf7}
  .hint{margin:18px 0 0;font-size:13px;color:#8299bb;letter-spacing:.08em}
  .yomi,.imi{opacity:0;transition:opacity .25s ease}
  .reveal .yomi,.reveal .imi{opacity:1}
  .reveal .hint{visibility:hidden}

  footer{padding:10px 16px 16px}
  .grades{display:flex;gap:10px}
  .grade{
    flex:1;padding:16px 0;border:0;border-radius:14px;font:inherit;font-size:16px;font-weight:700;
    letter-spacing:.1em;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.28);
  }
  .grade.ok{background:var(--paper);color:#16203a}
  .grade.ng{background:#8d3a2b;color:#fdeee9}
  .grade:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
  .grades[hidden]{display:none}
  .waiting{
    width:100%;padding:16px;border:1px dashed rgba(255,255,255,.22);border-radius:14px;
    text-align:center;font-size:14px;color:#8299bb;letter-spacing:.08em;
  }
  .waiting[hidden]{display:none}
  .undo{display:block;margin:0 0 8px auto;padding:6px 12px;border-radius:999px;
    border:1px solid rgba(255,255,255,.22);background:transparent;color:#a9bcd8;
    font:inherit;font-size:13px;cursor:pointer}
  .undo[hidden]{display:none}
  .note{margin:10px 0 0;text-align:center;font-size:12px;color:#7d92b4;line-height:1.6}
  .reset{background:none;border:0;color:#7d92b4;font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:4px}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">四字熟語マス</div>
  <div class="count" id="count">0 / 0</div>
</header>

<div class="row" role="group" aria-label="レベル">
  <button class="pill" id="lv-basic" aria-pressed="true">きほん</button>
  <button class="pill" id="lv-exam" aria-pressed="false">じゅけん</button>
  <button class="pill" id="lv-all" aria-pressed="false">ぜんぶ</button>
</div>
<div class="row mode" role="group" aria-label="出題のしかた">
  <button class="pill" id="md-all" aria-pressed="true">ぜんぶ出す</button>
  <button class="pill" id="md-weak" aria-pressed="false">にがてだけ（0）</button>
</div>

<main>
  <button class="card" id="card" aria-live="polite">
    <div class="masu" id="masu"></div>
    <p class="yomi" id="yomi"></p>
    <p class="imi" id="imi"></p>
    <p class="hint" id="hint">タップして　こたえを見る</p>
  </button>
</main>

<footer>
  <button class="undo" id="undo" hidden>← ひとつ もどす</button>
  <div class="waiting" id="waiting">こたえを見てから、できた・まだをえらぶ</div>
  <div class="grades" id="grades" hidden>
    <button class="grade ng" id="ng">まだ</button>
    <button class="grade ok" id="ok">できた</button>
  </div>
  <p class="note" id="note"></p>
</footer>

const KEY = 'yojijukugo-masu-v1';
const GRADUATE = 2;               // 連続2回できたら、にがてから卒業
let store = {}, storable = true;
let pool = [], queue = [], current = null, shownIdx = [], done = 0, revealed = false;
let history = [];
let level = 'basic', mode = 'all';

const $ = id => document.getElementById(id);
const masu = $('masu'), card = $('card');

/* ---- 記録（この端末のブラウザ内だけに保存） ---- */
function load(){
  try{ store = JSON.parse(localStorage.getItem(KEY) || '{}'); }
  catch(e){ store = {}; storable = false; }
}
function save(){
  if(!storable) return;
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){
    storable = false;
    $('note').textContent = 'この画面では記録を保存できません。ファイルをダウンロードして、SafariやChromeで開いてください。';
  }
}
const isWeak = w => store[w] && store[w].s < GRADUATE;
const weakCount = () => pool.filter(e => isWeak(e[0])).length;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* ---- 出題 ---- */
function basePool(){
  return level==='basic' ? BASIC.slice()
       : level==='exam'  ? EXAM.slice()
       : BASIC.concat(EXAM);
}
function buildQueue(){
  let base;
  if(mode==='weak'){
    base = pool.filter(e => isWeak(e[0]));
    if(base.length===0){
      mode='all'; syncMode();
      $('note').textContent = 'にがてはまだありません。ぜんぶ出します。';
      base = pool.slice();
    }
  }else{
    base = pool.concat(pool.filter(e => isWeak(e[0])));   // にがては出やすくする
  }
  queue = shuffle(base);
  done = 0;
}
function renderCard(item, idx){
  current = item; shownIdx = idx;
  $('count').textContent = done + ' / ' + (done + queue.length);
  masu.innerHTML = '';
  [...item[0]].forEach((ch,i)=>{
    const box = document.createElement('div');
    const sp = document.createElement('span');
    if(idx.includes(i)){ box.className='box filled'; sp.textContent=ch; }
    else { box.className='box hidden'; sp.textContent=ch; sp.style.visibility='hidden'; }
    box.appendChild(sp);
    masu.appendChild(box);
  });
  $('yomi').textContent = item[1];
  $('imi').textContent  = item[2];
  card.classList.remove('reveal');
  revealed = false;
}
function nextWord(){
  if(queue.length===0){
    buildQueue();
    $('note').textContent = 'ひとまわりしました。もう一周します。';
  }
  const item = queue.pop();
  done++;
  renderCard(item, shuffle([0,1,2,3]).slice(0,2));   // 4文字のうち2文字だけ見せる
  $('grades').hidden = true;
  $('waiting').hidden = false;
}
function reveal(){
  masu.querySelectorAll('.box.hidden span').forEach(s=>s.style.visibility='visible');
  card.classList.add('reveal');
  revealed = true;
  $('waiting').hidden = true;
  $('grades').hidden = false;
}
function grade(ok){
  if(!revealed) return;
  const w = current[0];
  history.push({ item: current, idx: shownIdx, prev: store[w] ? {...store[w]} : null });
  if(history.length > 30) history.shift();
  if(ok){
    // まちがえた記録がある語だけ、連続正解でにがてから卒業
    if(store[w]){
      store[w].s++;
      if(store[w].s >= GRADUATE) delete store[w];
    }
  }else{
    const rec = store[w] || {s:0,m:0};
    rec.s = 0; rec.m++; store[w] = rec;
  }
  save();
  syncMode();
  nextWord();
  updateUndo();
}

function undo(){
  const h = history.pop();
  if(!h) return;
  queue.push(current);                 // いま出ている問題は、あとでまた出す
  done--;
  const w = h.item[0];
  if(h.prev) store[w] = h.prev; else delete store[w];
  save();
  renderCard(h.item, h.idx);
  reveal();                            // 答えを出したまま、選び直せる状態に戻す
  syncMode();
  updateUndo();
}
function updateUndo(){
  $('undo').hidden = (history.length === 0);
}

/* ---- 表示の切り替え ---- */
function syncMode(){
  $('md-all').setAttribute('aria-pressed', mode==='all');
  $('md-weak').setAttribute('aria-pressed', mode==='weak');
  const n = weakCount();
  $('md-weak').textContent = 'にがてだけ（' + n + '）';
  $('md-weak').disabled = (n===0 && mode!=='weak');
  renderNote();
}
function renderNote(){
  const n = weakCount();
  $('note').innerHTML = '';
  if(!storable){
    $('note').textContent = 'この画面では記録を保存できません。ダウンロードしてブラウザで開くと保存されます。';
    return;
  }
  const txt = document.createElement('span');
  txt.textContent = 'にがて ' + n + '語　';
  const btn = document.createElement('button');
  btn.className = 'reset'; btn.textContent = '記録をけす';
  btn.onclick = () => {
    if(!confirm('にがての記録をぜんぶ消します。よろしいですか？')) return;
    store = {}; save(); mode='all'; history = []; buildQueue(); syncMode(); nextWord(); updateUndo();
  };
  $('note').append(txt, btn);
}
function setLevel(name){
  level = name;
  $('lv-basic').setAttribute('aria-pressed', name==='basic');
  $('lv-exam').setAttribute('aria-pressed', name==='exam');
  $('lv-all').setAttribute('aria-pressed', name==='all');
  pool = basePool();
  history = [];
  buildQueue(); syncMode(); nextWord(); updateUndo();
}
function setMode(name){
  mode = name;
  history = [];
  buildQueue(); syncMode(); nextWord(); updateUndo();
}

card.addEventListener('click', ()=>{ if(!revealed) reveal(); });
$('undo').addEventListener('click', e=>{ e.stopPropagation(); undo(); });
$('ok').addEventListener('click', e=>{ e.stopPropagation(); grade(true); });
$('ng').addEventListener('click', e=>{ e.stopPropagation(); grade(false); });
$('lv-basic').addEventListener('click', ()=>setLevel('basic'));
$('lv-exam').addEventListener('click', ()=>setLevel('exam'));
$('lv-all').addEventListener('click', ()=>setLevel('all'));
$('md-all').addEventListener('click', ()=>setMode('all'));
$('md-weak').addEventListener('click', ()=>setMode('weak'));

load();
setLevel('basic');
</script>
