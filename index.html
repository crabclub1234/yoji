<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101b33">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ことばマス</title>
<style>
  :root{
    --ai-deep:#0d1729; --ai:#1b2c4e;
    --paper:#f5f1e6; --paper-line:#c9d3e4;
    --sumi:#1a1c22; --shu:#c4402c; --kin:#c9a75a;
    --mincho:"UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","Yu Kyokasho","YuKyokasho","Hiragino Mincho ProN","Yu Mincho",serif;
    --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--gothic);color:var(--paper);
    background:radial-gradient(120% 80% at 50% 0%, #22375e 0%, var(--ai) 45%, var(--ai-deep) 100%);
    background-attachment:fixed;
    display:flex;flex-direction:column;min-height:100dvh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px}
  .brand{font-family:var(--mincho);font-size:15px;letter-spacing:.28em;color:var(--kin)}
  .count .done-ok{color:#8fd6a8}
  .count .left{color:#7d92b4}
  .count{font-size:12.5px;font-variant-numeric:tabular-nums;color:#9fb2d0;letter-spacing:.06em}
  .back{background:none;border:0;color:#a9bcd8;font:inherit;font-size:14px;cursor:pointer;padding:4px 6px 4px 0}

  .screen{flex:1;display:flex;flex-direction:column}
  .screen[hidden]{display:none}

  /* ---- トップ ---- */
  #home main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 16px 24px}
  .deck{
    display:block;width:100%;text-align:left;cursor:pointer;
    padding:20px;border-radius:16px;border:1px solid rgba(201,167,90,.35);
    background:rgba(255,255,255,.04);color:inherit;font:inherit;
  }
  .deck-name{font-family:var(--mincho);font-size:26px;letter-spacing:.14em;color:var(--paper)}
  .deck-sub{margin-top:10px;font-size:12.5px;color:#9fb2d0;letter-spacing:.02em}
  .lv-line{display:flex;align-items:baseline;gap:9px;margin-top:5px;font-variant-numeric:tabular-nums}
  .lv-line .lv{color:var(--kin);min-width:3.4em}
  .lv-line .st-ok{color:#dfe7f3}
  .lv-line .st-ng{color:#e08a76}
  .lv-line .st-new{color:#7d92b4}
  .lv-line .st-due{color:#8fd6a8}
  .deck-cont{margin-top:8px;font-size:12px;color:var(--kin)}
  .bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.09);margin:10px 0 0}
  .bar .seg-solid{background:#8fd6a8}
  .bar .seg-ok{background:rgba(143,214,168,.45)}
  .bar .seg-ng{background:#c4402c}
  .total{padding:0 16px 14px}
  .total-line{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--paper)}
  .total .total-sub{font-size:11.5px;color:#7d92b4}
  .deck-name{position:relative}
  .deck-pct{float:right;font-family:var(--gothic);font-size:15px;color:#8fd6a8;letter-spacing:0}
  .lead{padding:0 16px;font-size:13px;color:#8299bb;text-align:center;margin:0 0 6px}

  /* ---- 出題 ---- */
  .row{display:flex;gap:6px;padding:0 16px 8px}
  .row[hidden]{display:none}
  .pill{
    flex:1;padding:9px 0;border-radius:999px;border:1px solid rgba(201,167,90,.35);
    background:transparent;color:#c3d0e6;font:inherit;font-size:13px;cursor:pointer;
  }
  .pill[aria-pressed="true"]{background:var(--kin);color:#1b1405;border-color:var(--kin);font-weight:600}
  .pill:disabled{opacity:.4;cursor:default}
  .row.mode .pill{border-color:rgba(255,255,255,.18)}
  .row.mode .pill[aria-pressed="true"]{background:rgba(255,255,255,.9);color:#16203a;border-color:transparent}
  .pill:focus-visible,.grade:focus-visible,.card:focus-visible,.deck:focus-visible,.back:focus-visible{outline:2px solid var(--kin);outline-offset:3px}

  #quiz main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 16px 8px}
  .card{display:block;width:100%;border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:center;cursor:pointer}

  /* 四字熟語：マス4つ */
  .masu{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .masu[hidden]{display:none}
  .box{
    position:relative;aspect-ratio:1/1;border-radius:3px;background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 0 rgba(0,0,0,.25);overflow:hidden;
  }
  .box::before,.box::after{content:"";position:absolute;background:var(--paper-line)}
  .box::before{left:8%;right:8%;height:1px;top:50%}
  .box::after{top:8%;bottom:8%;width:1px;left:50%}
  .box.filled::before,.box.filled::after{opacity:.35}
  .box span{position:relative;font-family:var(--mincho);font-weight:600;font-size:clamp(34px,13.5vw,60px);line-height:1;color:var(--sumi)}
  .box.hidden span{color:var(--shu)}

  /* 慣用句・ことわざ：文の中に空マス */
  .phrase{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px 1px;
    background:var(--paper);border-radius:10px;padding:22px 16px;
    box-shadow:0 3px 0 rgba(0,0,0,.25);
    font-family:var(--mincho);font-weight:600;color:var(--sumi);line-height:1.5;
  }
  .phrase[hidden]{display:none}
  .ch{display:inline-block}
  .ch.blank{
    position:relative;width:1.15em;height:1.15em;
    border:1.5px solid #8494ad;border-radius:2px;margin:0 1px;
  }
  .ch.blank span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--shu)}

  .reveal .box.hidden span,.reveal .ch.blank span{animation:ink .32s ease-out both}
  @keyframes ink{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}

  .yomi{margin:16px 0 0;min-height:20px;font-size:15px;letter-spacing:.12em;color:var(--kin)}
  .imi{margin:10px auto 0;max-width:34em;min-height:3.2em;font-size:15.5px;line-height:1.75;color:#e7edf7}
  .imi .glyph{
    display:inline-block;font-family:var(--gothic);font-size:34px;line-height:1;
    color:var(--shu);background:var(--paper);border-radius:4px;
    padding:6px 10px;margin-right:12px;vertical-align:middle;
  }
  .phrase .ch.line{display:block;width:100%;text-align:left;line-height:1.9}
  .phrase .glyph-inline{
    font-family:var(--gothic);color:var(--shu);margin-right:.35em;
  }
  .tag{
    align-self:center;margin:0 0 12px;padding:4px 14px;border-radius:999px;
    font-size:12px;letter-spacing:.16em;color:#8fd6a8;border:1px solid rgba(143,214,168,.45);
  }
  .tag[hidden]{display:none}
  .options{
    list-style:none;margin:0 0 14px;padding:12px 14px;
    border:1px solid rgba(255,255,255,.13);border-radius:12px;
    font-size:12.5px;line-height:1.9;color:#a9bcd8;text-align:left;
  }
  .options[hidden]{display:none}
  .options li::before{content:"・";color:var(--kin)}
  .kanji-svg{display:block;width:min(46vw,190px);height:auto;margin:0 auto}
  .credit{margin:14px 16px 0;text-align:center;font-size:11px;color:#5f7291}
  .hint{margin:16px 0 0;font-size:13px;color:#8299bb;letter-spacing:.08em}
  .yomi,.imi{opacity:0;transition:opacity .25s ease}
  .card.swap .yomi,.card.swap .imi{transition:none}
  .card.swap .box.hidden span,.card.swap .ch.blank span{animation:none}
  .reveal .yomi,.reveal .imi{opacity:1}
  .card[data-dir="fill"] .imi{opacity:1}      /* 穴うめ：意味はヒントとして先に出す */
  .card[data-dir="word"] .imi{opacity:1}      /* ことば当て：意味が問題文 */
  .card[data-dir="meaning"] .yomi{opacity:1}  /* 意味当て：読み仮名を先に出す */
  .card[data-kind="bushu"] .yomi{opacity:1}
  .card[data-kind="bushu"] .imi{opacity:0}
  .card[data-kind="bushu"].reveal .imi{opacity:1}
  .reveal .hint{visibility:hidden}

  footer{padding:10px 16px 16px}
  .undo{display:block;margin:0 0 8px auto;padding:6px 12px;border-radius:999px;
    border:1px solid rgba(255,255,255,.22);background:transparent;color:#a9bcd8;font:inherit;font-size:13px;cursor:pointer}
  .undo[hidden]{display:none}
  .grades{display:flex;gap:10px}
  .grades[hidden]{display:none}
  .grade{flex:1;padding:16px 0;border:0;border-radius:14px;font:inherit;font-size:16px;font-weight:700;
    letter-spacing:.1em;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.28)}
  .grade.ok{background:var(--paper);color:#16203a}
  .grade.ng{background:#8d3a2b;color:#fdeee9}
  .grade:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
  .waiting{width:100%;padding:16px;border:1px dashed rgba(255,255,255,.22);border-radius:14px;
    text-align:center;font-size:14px;color:#8299bb;letter-spacing:.08em}
  .waiting[hidden]{display:none}
  .note{margin:10px 0 0;text-align:center;font-size:12px;color:#7d92b4;line-height:1.6}
  .reset{background:none;border:0;color:#7d92b4;font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:4px}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============ トップ ============ -->
<section class="screen" id="home">
  <header><div class="brand">ことばマス</div><div class="count" id="home-count"></div></header>
  <main>
    <div class="total" id="total"></div>
    <p class="lead">やるジャンルをえらんでね</p>
    <button class="deck" id="deck-yoji"></button>
    <button class="deck" id="deck-kanyo"></button>
    <button class="deck" id="deck-koto"></button>
    <button class="deck" id="deck-bushu"></button>
    <button class="deck" id="deck-kaku"></button>
    <button class="deck" id="deck-tairui"></button>
    <button class="deck" id="deck-doon"></button>
    <button class="deck" id="deck-kousei"></button>
    <button class="deck" id="deck-yomi"></button>
    <button class="deck" id="deck-keigo"></button>
    <p class="credit">書き順データ: KanjiVG（CC BY-SA 3.0）</p>
  </main>
</section>

<!-- ============ 出題 ============ -->
<section class="screen" id="quiz" hidden>
  <header>
    <button class="back" id="back">← やめる</button>
    <div class="brand" id="deck-title"></div>
    <div class="count" id="count">0 / 0</div>
  </header>

  <div class="row" id="levels" role="group" aria-label="レベル">
    <button class="pill" id="lv-basic" aria-pressed="true">基本</button>
    <button class="pill" id="lv-exam" aria-pressed="false">受験</button>
    <button class="pill" id="lv-all" aria-pressed="false">全部</button>
  </div>
  <div class="row mode" id="dirs" role="group" aria-label="出題の向き">
    <button class="pill" id="dir-fill" aria-pressed="true">穴うめ</button>
    <button class="pill" id="dir-meaning" aria-pressed="false">意味当て</button>
    <button class="pill" id="dir-word" aria-pressed="false" hidden>ことば当て</button>
  </div>
  <div class="row mode" role="group" aria-label="出題のしかた">
    <button class="pill" id="md-all" aria-pressed="true">全部出す</button>
    <button class="pill" id="md-weak" aria-pressed="false">まだの語だけ（0）</button>
  </div>

  <main>
    <div class="tag" id="tag" hidden>復習</div>
    <ul class="options" id="options" hidden></ul>
    <button class="card" id="card" aria-live="polite">
      <div class="masu" id="masu" hidden></div>
      <div class="phrase" id="phrase" hidden></div>
      <p class="yomi" id="yomi"></p>
      <p class="imi" id="imi"></p>
      <p class="hint" id="hint">タップして　こたえを見る</p>
    </button>
  </main>

  <footer>
    <button class="undo" id="undo" hidden>← ひとつ もどす</button>
    <div class="waiting" id="waiting">こたえを見てから、できた・まだをえらぶ</div>
    <div class="grades" id="grades" hidden>
      <button class="grade ng" id="ng">まだ</button>
      <button class="grade ok" id="ok">できた</button>
    </div>
    <p class="note" id="note"></p>
  </footer>
</section>

<script>

["異口同音","いくどうおん","大勢の人が口をそろえて同じことを言うこと。"],

const VERSION = '2026-10-03-1';
async function checkUpdate(){
  try{
    const res = await fetch(location.pathname + '?_=' + Date.now(), {cache:'no-store'});
    const txt = await res.text();
    const m = txt.match(/const VERSION = '([^']+)'/);
    if(m && m[1] !== VERSION && !sessionStorage.getItem('upd')){
      sessionStorage.setItem('upd','1');
      location.replace(location.pathname + '?v=' + m[1]);
    }
  }catch(e){ /* オフラインなら何もしない */ }
}

const KEY = 'kokugo-masu-v1';
const OLD_KEY = 'yojijukugo-masu-v1';
const GRADUATE = 2;

let store = {yoji:{}, kanyo:{}, koto:{}}, storable = true;   // 他ジャンルは使うときに作られる
let deckId = 'yoji', level = 'basic', mode = 'all', dir = 'fill';
let pool = [], queue = [], current = null, shownIdx = [], done = 0, revealed = false;
let history = [];
let dueLeft = 0, noticed = true;
let queueLabel = 'きょう';

const $ = id => document.getElementById(id);

/* ---- 保存（この端末のブラウザ内だけ） ---- */
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ store = Object.assign({yoji:{},kanyo:{},koto:{}}, JSON.parse(raw)); return; }
    const old = localStorage.getItem(OLD_KEY);          // 四字熟語だけの旧データを引き継ぐ
    if(old) store.yoji = JSON.parse(old);
  }catch(e){ storable = false; }
}
function save(){
  if(!storable) return;
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ storable = false; renderNote(); }
}
const rec = () => store[deckId] || (store[deckId] = {});
function daily(){                                    // その日の消化数（日付が変わればリセット）
  if(!store.daily || store.daily.d !== today()) store.daily = {d: today(), rev: 0, nw: 0};
  return store.daily;
}
const restRev = () => Math.max(0, DUE_CAP - daily().rev);
const restNew = () => Math.max(0, NEW_CAP - daily().nw);
const DUE_CAP = 47;      // 1回にやる復習の上限（全ジャンル合計）
const NEW_CAP = 23;      // 1回に進める新しい語の上限
const SPAN = [3, 21];    // 復習は2回：3日後と21日後                      // 忘却曲線に合わせた復習の間隔（日）
const today = () => {
  const n = new Date();
  return Math.floor(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / 86400000);
};
function norm(x){                                    // 古い記録を新しい形に読みかえる
  if(x.b === undefined){
    const done = x.m === 0 ? x.s >= 1 : x.s >= GRADUATE;
    x.b = done ? 1 : 0; x.d = 0;
  }
  return x;
}
const isDone = x => norm(x).b >= 1;
const isDue  = x => norm(x).d <= today();
const isWeak = (id,w) => {                           // 「まだ」＝最後にまちがえた語
  const x = store[id] && store[id][w];
  return !!x && !isDone(x);
};
const needsReview = (id,w) => {                      // 今日が復習日の語
  const x = store[id] && store[id][w];
  return !!x && isDue(x);
};
function stats(id, list){
  const r = store[id] || {};
  let ne=0, ok=0, ng=0, due=0, solid=0;
  list.forEach(e => {
    const x = r[e[0]];
    if(!x){ ne++; return; }
    if(isDone(x)){ ok++; if(x.b >= SPAN.length) solid++; } else ng++;
    if(isDue(x)) due++;
  });
  return {ne, ok, ng, due, solid};
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
const allOf = d => d.basic.concat(d.exam);

/* ---- トップ ---- */
function progressBar(s, total){
  const bar = document.createElement('div'); bar.className = 'bar';
  [['seg-solid', s.solid], ['seg-ok', s.ok - s.solid], ['seg-ng', s.ng]].forEach(([cls, n])=>{
    if(n <= 0) return;
    const seg = document.createElement('div');
    seg.className = cls; seg.style.width = (n / total * 100) + '%';
    bar.appendChild(seg);
  });
  return bar;
}
function renderHome(){
  let totalNew = 0, totalNg = 0, totalDue = 0, totalAll = 0, totalOk = 0, totalSolid = 0;
  for(const id in DECKS){
    const d = DECKS[id];
    const btn = $('deck-' + id);
    btn.innerHTML = '';
    const n = document.createElement('div'); n.className='deck-name'; n.textContent = d.name;
    const wrap = document.createElement('div'); wrap.className='deck-sub';
    const lb = d.levelLabels || ['基本','受験','全部'];
    [[lb[0], d.basic], [lb[1], d.exam]].forEach(([label, list])=>{
      if(!list.length) return;
      const s = stats(id, list);
      totalNew += s.ne; totalNg += s.ng; totalDue += s.due;
      const line = document.createElement('div'); line.className='lv-line';
      const a = document.createElement('span'); a.className='lv'; a.textContent = label + ' ' + list.length;
      const b = document.createElement('span'); b.className='st-new'; b.textContent = '未習 ' + s.ne;
      const c = document.createElement('span'); c.className='st-ok';  c.textContent = 'できた ' + s.ok;
      const e = document.createElement('span'); e.className='st-ng';  e.textContent = 'まだ ' + s.ng;
      line.append(a,b,c,e);
      if(s.due){ const f = document.createElement('span'); f.className='st-due'; f.textContent = '復習 ' + s.due; line.appendChild(f); }
      wrap.appendChild(line);
    });
    const all = d.basic.length + d.exam.length;
    const ds = stats(id, d.basic.concat(d.exam));
    totalAll += all; totalOk += ds.ok; totalSolid += ds.solid;
    const pct = document.createElement('span'); pct.className = 'deck-pct';
    pct.textContent = Math.round(ds.ok / all * 100) + '%';
    n.appendChild(pct);
    btn.append(n, progressBar(ds, all), wrap);
    const ses = (store.sessions || {})[id];
    if(ses && ses.cur && !(ses.level !== 'basic' && !d.exam.length)){
      const lv = ses.level==='exam' ? lb[1] : ses.level==='all' ? lb[2] : lb[0];
      const c = document.createElement('div'); c.className='deck-cont';
      c.textContent = 'つづき（' + lv + '・のこり' + ((ses.q||[]).length + 1) + '語）';
      btn.appendChild(c);
    }
  }
  const dy = daily();
  const hc = $('home-count'); hc.innerHTML = '';
  const part = (label, done, cap) => {
    const s = document.createElement('span');
    if(done >= cap) s.className = 'done-ok';
    s.textContent = label + ' ' + done + '/' + cap + '　';
    return s;
  };
  hc.append(part('復習', dy.rev, DUE_CAP), part('新語', dy.nw, NEW_CAP));
  const tot = $('total');
  tot.innerHTML = '';
  const tline = document.createElement('div'); tline.className = 'total-line';
  const tl = document.createElement('span');
  tl.textContent = '全体 ' + Math.round(totalOk / totalAll * 100) + '%';
  const tr = document.createElement('span'); tr.className = 'total-sub';
  tr.textContent = 'できた ' + totalOk + ' / ' + totalAll + '　うちしっかり ' + totalSolid;
  tline.append(tl, tr);
  tot.append(tline, progressBar({solid: totalSolid, ok: totalOk, ng: totalNg}, totalAll));
  const left = document.createElement('span');
  left.className = 'left';
  const rv = Math.min(totalDue, restRev());
  left.textContent = (rv || restNew()) ? 'のこり ' + (rv + restNew()) : '達成';
  hc.appendChild(left);
}
function saveSession(){
  if(!current) return;
  store.sessions = store.sessions || {};
  store.sessions[deckId] = {level, mode, dir, done, day: today(), cur: current[0], q: queue.map(e => e[0])};
  save();
}
function restoreSession(s){
  level = s.level || 'basic'; mode = s.mode || 'all'; dir = s.dir || 'fill'; history = [];
  if(s.day !== today()){          // 日をまたいだら、その日の復習を優先して組み直す
    syncLevelPills(level); syncDirPills();
    setLevel(level);
    $('note').textContent = '日がかわったので、今日の復習から始めます。';
    return;
  }
  syncLevelPills(level); syncDirPills();
  pool = basePool();
  if(!pool.length){ level = 'basic'; syncLevelPills(level); pool = basePool(); }
  const map = new Map(allOf(DECKS[deckId]).map(e => [e[0], e]));
  queue = (s.q || []).map(w => map.get(w)).filter(Boolean);
  done = s.done || 0;
  const item = map.get(s.cur);
  syncMode(); updateUndo();
  if(item){
    renderCard(item, shuffle([0,1,2,3]).slice(0,2).concat(Math.floor(Math.random()*1000)));
    $('grades').hidden = true; $('waiting').hidden = false;
    const note = $('note'); note.innerHTML = '';
    const sp = document.createElement('span'); sp.textContent = 'つづきから始めます。　';
    const re = document.createElement('button'); re.className = 'reset'; re.textContent = 'はじめから';
    re.onclick = () => setLevel(level);
    note.append(sp, re);
  }else{
    nextWord();
  }
}
function syncDirPills(){
  const d = DECKS[deckId];
  $('dirs').hidden = !!d.noDir;
  if(d.noDir) dir = 'fill';
  const labels = d.dirLabels || ['穴うめ','意味当て','ことば当て'];
  $('dir-fill').textContent = labels[0];
  $('dir-meaning').textContent = labels[1];
  $('dir-word').hidden = !labels[2];
  if(labels[2]) $('dir-word').textContent = labels[2];
  if(!labels[2] && dir === 'word') dir = 'fill';
  $('dir-fill').setAttribute('aria-pressed', dir==='fill');
  $('dir-meaning').setAttribute('aria-pressed', dir==='meaning');
  $('dir-word').setAttribute('aria-pressed', dir==='word');
  $('hint').textContent = dir==='meaning' ? (d.hintBack || 'タップして　意味を見る')
                        : dir==='word'    ? 'この意味のことばは？'
                        : d.hint;
}
function setDir(name){
  dir = name; history = [];
  syncDirPills();
  pool = basePool();
  if(!pool.length){
    dir = 'fill'; syncDirPills(); pool = basePool();
    $('note').textContent = '筆順のきまりには「何画目」がないので、「何画？」で出します。';
  }
  buildQueue(); syncMode(); nextWord(); updateUndo();
}
function openDeck(id){
  deckId = id; mode = 'all'; dir = 'fill'; history = [];
  $('deck-title').textContent = DECKS[id].name;
  syncDirPills();
  $('levels').hidden = (DECKS[id].exam.length === 0);
  $('home').hidden = true; $('quiz').hidden = false;
  const s = (store.sessions || {})[id];
  if(s && s.cur) restoreSession(s); else { level='basic'; setLevel('basic'); }
}
function goHome(save_it){
  if(save_it) saveSession();
  $('quiz').hidden = true; $('home').hidden = false;
  renderHome();
}

/* ---- 出題 ---- */
function basePool(){
  const d = DECKS[deckId];
  let p = level==='basic' ? d.basic.slice() : level==='exam' ? d.exam.slice() : allOf(d);
  return p;
}
function buildQueue(){
  let base;
  if(mode==='weak'){
    base = pool.filter(e => isWeak(deckId, e[0]));
    queueLabel = 'まだの語';
    if(base.length===0){ mode='all'; queueLabel = 'きょう'; $('note').textContent='「まだ」の語はありません。全部出します。'; base = pool.slice(); }
  }else{
    let due = pool.filter(e => needsReview(deckId, e[0]));       // 今日が復習日の語
    due.sort((a, b) => {                                          // 期限ぎれが古い順、まちがえた語が先
      const x = store[deckId][a[0]], y = store[deckId][b[0]];
      return (isWeak(deckId, a[0]) ? 0 : 1) - (isWeak(deckId, b[0]) ? 0 : 1) || x.d - y.d;
    });
    due = due.slice(0, restRev());                                // 1日の上限まで
    due = due.concat(due.filter(e => isWeak(deckId, e[0])));      // 「まだ」の語は2回
    const fresh = shuffle(pool.filter(e => !(store[deckId] && store[deckId][e[0]]))).slice(0, restNew());
    if(!due.length && !fresh.length){
      // 今日のぶんは終わり。ここからは、期限ぎれの残り → 未習 → おさらい の順で出す
      const extraDue = pool.filter(e => needsReview(deckId, e[0]));
      const unseen   = pool.filter(e => !(store[deckId] && store[deckId][e[0]]));
      const seen     = pool.filter(e => store[deckId] && store[deckId][e[0]] && !needsReview(deckId, e[0]));
      queue = shuffle(seen).concat(shuffle(unseen)).concat(shuffle(extraDue));
      if(!queue.length) queue = shuffle(pool.slice());
      done = 0; dueLeft = 0; noticed = true; queueLabel = 'おまけ';
      $('note').textContent = '今日のぶんは終わりました。ここからはおまけです。';
      return;
    }
    // 取り出しは末尾からなので、復習を後ろに置いて先に出す
    queue = shuffle(fresh).concat(shuffle(due));
    dueLeft = due.length; noticed = false; queueLabel = 'きょう';
    done = 0;
    return;
  }
  queue = shuffle(base);
  done = 0; dueLeft = 0; noticed = true;
}
function renderCard(item, idx){
  const card0 = $('card');
  card0.classList.add('swap');       // 切り替え中はフェードさせない
  card0.classList.remove('reveal');  // 先に伏せてから中身を入れかえる
  current = item; shownIdx = idx;
  $('count').textContent = queueLabel + ' ' + done + ' / ' + (done + queue.length);
  const kind = DECKS[deckId].kind;
  $('masu').hidden = (kind !== 'masu');
  $('phrase').hidden = (kind === 'masu');
  if(kind === 'masu'){
    renderMasu(item, idx);
    $('yomi').textContent = item[1];
    $('imi').textContent  = item[2];
  }else if(kind === 'bushu'){
    if(deckId === 'kaku' && item[6] && STROKES[item[1]]){
      renderStroke(item, idx);
      $('hint').textContent = 'タップして　何画目か見る';
    }else{
      renderBushu(item);
      if(deckId === 'kaku') $('hint').textContent = 'タップして　筆順を見る';
    }
  }else{
    renderPhrase(item);
    $('yomi').textContent = item[3] || '';
    $('imi').textContent  = item[2];
  }
  const ch = (DECKS[deckId].choicesBasicOnly && level === 'exam') ? null : DECKS[deckId].choices;
  const opt = $('options');
  opt.hidden = !ch;
  if(ch && !opt.dataset.filled){
    opt.innerHTML = ch.map(c => '<li>' + c + '</li>').join('');
    opt.dataset.filled = deckId;
  }else if(ch && opt.dataset.filled !== deckId){
    opt.innerHTML = ch.map(c => '<li>' + c + '</li>').join('');
    opt.dataset.filled = deckId;
  }
  const past = store[deckId] && store[deckId][item[0]];
  const tag = $('tag');
  tag.hidden = !past;
  if(past) tag.textContent = isDue(past) ? '復習' : 'おさらい';
  const card = $('card');
  card.dataset.dir = dir;
  card.dataset.kind = kind;
  revealed = false;
  void card.offsetWidth;             // ここまでの変更を確定させてから
  requestAnimationFrame(() => card.classList.remove('swap'));
}
function renderMasu(item, idx){
  const masu = $('masu'); masu.innerHTML = '';
  [...item[0]].forEach((ch,i)=>{
    const box = document.createElement('div'), sp = document.createElement('span');
    const open = dir === 'meaning' ? true : dir === 'word' ? false : idx.slice(0,2).includes(i);
    if(open){ box.className='box filled'; sp.textContent=ch; }
    else { box.className='box hidden'; sp.textContent=ch; sp.style.visibility='hidden'; }
    box.appendChild(sp); masu.appendChild(box);
  });
}
function renderStroke(item, idx){
  const el = $('phrase'); el.innerHTML = '';
  const ps = STROKES[item[1]], n = ps.length;
  const si = (item[6] ? item[6] - 1 : idx[2] % n);   // プリントと同じ画を赤くする
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 109 109');
  svg.setAttribute('class', 'kanji-svg');
  ps.forEach((d, i) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke-width', '5.5');
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('stroke-linejoin', 'round');
    p.setAttribute('stroke', i === si ? '#c4402c' : '#1a1c22');
    svg.appendChild(p);
  });
  el.appendChild(svg);
  $('yomi').textContent = item[3];
  $('imi').textContent  = (si + 1) + '画目　（全' + n + '画）';
}
function renderBushu(item){
  const el = $('phrase'); el.innerHTML = '';
  const glyph = item[5] || '';
  const imi = $('imi');
  imi.innerHTML = '';
  if(dir === 'meaning'){
    // 部首を見せて、その部首の漢字を当てる
    const s = document.createElement('span'); s.className = 'ch';
    s.textContent = item[2];
    el.style.fontSize = item[2].length <= 6 ? '30px' : '24px';
    el.appendChild(s);
    if(glyph){ const g = document.createElement('span'); g.className='glyph-inline'; g.textContent = glyph; el.prepend(g); }
    imi.textContent = item[1];
  }else{
    // 漢字や例文を見せて、答えを当てる
    const lines = item[1].split('\n');
    const longest = Math.max(...lines.map(l => l.length));
    el.style.fontSize = lines.length > 1
      ? (longest <= 12 ? '20px' : '17px')
      : (longest <= 6 ? '30px' : longest <= 10 ? '25px' : '21px');
    lines.forEach(line => {
      const s = document.createElement('span');
      s.className = 'ch' + (lines.length > 1 ? ' line' : '');
      s.textContent = line;
      el.appendChild(s);
    });
    if(glyph){ const g = document.createElement('span'); g.className='glyph'; g.textContent = glyph; imi.appendChild(g); }
    imi.appendChild(document.createTextNode(item[2] + (item[4] ? '　' + item[4] : '')));
  }
  $('yomi').textContent = item[3];
}
function renderPhrase(item){
  const el = $('phrase'); el.innerHTML = '';
  const [text, hidden] = item;
  const start = text.indexOf(hidden), end = start + hidden.length;
  el.style.fontSize = text.length <= 8 ? '30px' : text.length <= 13 ? '25px' : '21px';
  [...text].forEach((ch,i)=>{
    const s = document.createElement('span');
    if(dir === 'word' || (dir !== 'meaning' && i >= start && i < end)){
      s.className = 'ch blank';
      const inner = document.createElement('span');
      inner.textContent = ch; inner.style.visibility = 'hidden';
      s.appendChild(inner);
    }else{
      s.className = 'ch'; s.textContent = ch;
    }
    el.appendChild(s);
  });
}
function nextWord(){
  if(queue.length===0){
    buildQueue();
    if(queueLabel !== 'おまけ') $('note').textContent = 'ひとまわりしました。もう一周します。';
  }
  const item = queue.pop();
  if(dueLeft > 0){
    dueLeft--;
    if(dueLeft === 0) noticed = false;
  }else if(!noticed){
    noticed = true;
    $('note').textContent = '今日の復習おわり。ここから新しい語です。';
  }
  done++;
  renderCard(item, shuffle([0,1,2,3]).slice(0,2).concat(Math.floor(Math.random()*1000)));
  $('grades').hidden = true; $('waiting').hidden = false;
}
function reveal(){
  $('masu').querySelectorAll('.box.hidden span').forEach(s=>s.style.visibility='visible');
  $('phrase').querySelectorAll('.ch.blank span').forEach(s=>s.style.visibility='visible');
  $('card').classList.add('reveal');
  revealed = true;
  $('waiting').hidden = true; $('grades').hidden = false;
}
function grade(ok){
  if(!revealed) return;
  const w = current[0], r = rec();
  history.push({item:current, idx:shownIdx, prev: r[w] ? {...r[w]} : null});
  if(history.length > 30) history.shift();
  const before = r[w];
  const dy = daily();
  if(!before) dy.nw++; else if(isDue(before)) dy.rev++;
  const e = norm(r[w] || {s:0, m:0, b:0, d:0});
  if(ok){
    e.s++; e.b = Math.min(e.b + 1, SPAN.length);
    e.d = today() + SPAN[e.b - 1];                   // 1→3→7→14→30日後
  }else{
    e.s = 0; e.m++; e.b = 0;
    e.d = today() + 1;                               // まちがえたら明日また出す
  }
  r[w] = e;
  save(); syncMode(); nextWord(); saveSession(); updateUndo();
}
function undo(){
  const h = history.pop(); if(!h) return;
  queue.push(current); done--;
  const r = rec(), w = h.item[0];
  const dy = daily();
  if(!h.prev) dy.nw = Math.max(0, dy.nw - 1);
  else if(isDue(h.prev)) dy.rev = Math.max(0, dy.rev - 1);
  if(h.prev) r[w] = h.prev; else delete r[w];
  save();
  renderCard(h.item, h.idx); reveal(); syncMode(); updateUndo();
}
const updateUndo = () => { $('undo').hidden = (history.length === 0); };

/* ---- 切り替え ---- */
function syncMode(){
  $('md-all').setAttribute('aria-pressed', mode==='all');
  $('md-weak').setAttribute('aria-pressed', mode==='weak');
  const n = pool.filter(e => isWeak(deckId, e[0])).length;
  $('md-weak').textContent = 'まだの語だけ（' + n + '）';
  $('md-weak').disabled = (n===0 && mode!=='weak');
  renderNote();
}
function renderNote(){
  const note = $('note'); note.innerHTML = '';
  if(!storable){ note.textContent='この画面では記録を保存できません。ダウンロードしてブラウザで開いてください。'; return; }
  const n = pool.filter(e => isWeak(deckId, e[0])).length;
  const dueN = pool.filter(e => needsReview(deckId, e[0])).length;
  const dy = daily();
  const txt = document.createElement('span');
  txt.textContent = '今日 復習 ' + dy.rev + '/' + DUE_CAP + '・新語 ' + dy.nw + '/' + NEW_CAP
                  + '　まだ ' + n + '語　';
  const btn = document.createElement('button');
  btn.className='reset'; btn.textContent='このジャンルの記録をけす';
  btn.onclick = () => {
    if(!confirm(DECKS[deckId].name + 'の学習記録を消します。よろしいですか？')) return;
    store[deckId] = {}; save(); mode='all'; history=[]; buildQueue(); syncMode(); nextWord(); updateUndo();
  };
  note.append(txt, btn);
}
function syncLevelPills(name){
  const lb = (DECKS[deckId] && DECKS[deckId].levelLabels) || ['基本','受験','全部'];
  $('lv-basic').textContent = lb[0];
  $('lv-exam').textContent  = lb[1];
  $('lv-all').textContent   = lb[2];
  $('lv-basic').setAttribute('aria-pressed', name==='basic');
  $('lv-exam').setAttribute('aria-pressed', name==='exam');
  $('lv-all').setAttribute('aria-pressed', name==='all');
}
function setLevel(name){
  level = name;
  syncLevelPills(name);
  pool = basePool(); history = [];
  if(!pool.length && level !== 'basic'){ level = 'basic'; syncLevelPills(level); pool = basePool(); }
  if(!pool.length){
    dir = 'fill'; syncDirPills(); pool = basePool();
    $('note').textContent = '筆順のきまりには「何画目」がないので、「何画？」で出します。';
  }
  buildQueue(); syncMode(); nextWord(); updateUndo();
}
function setMode(name){
  mode = name; history = [];
  buildQueue(); syncMode(); nextWord(); updateUndo();
}

$('card').addEventListener('click', ()=>{ if(!revealed) reveal(); });
$('ok').addEventListener('click', e=>{ e.stopPropagation(); grade(true); });
$('ng').addEventListener('click', e=>{ e.stopPropagation(); grade(false); });
$('undo').addEventListener('click', e=>{ e.stopPropagation(); undo(); });
$('back').addEventListener('click', ()=>goHome(true));
$('lv-basic').addEventListener('click', ()=>setLevel('basic'));
$('lv-exam').addEventListener('click', ()=>setLevel('exam'));
$('lv-all').addEventListener('click', ()=>setLevel('all'));
$('dir-fill').addEventListener('click', ()=>setDir('fill'));
$('dir-meaning').addEventListener('click', ()=>setDir('meaning'));
$('dir-word').addEventListener('click', ()=>setDir('word'));
$('md-all').addEventListener('click', ()=>setMode('all'));
$('md-weak').addEventListener('click', ()=>setMode('weak'));
$('deck-yoji').addEventListener('click', ()=>openDeck('yoji'));
$('deck-kanyo').addEventListener('click', ()=>openDeck('kanyo'));
$('deck-koto').addEventListener('click', ()=>openDeck('koto'));
$('deck-bushu').addEventListener('click', ()=>openDeck('bushu'));
$('deck-kaku').addEventListener('click', ()=>openDeck('kaku'));
$('deck-tairui').addEventListener('click', ()=>openDeck('tairui'));
$('deck-doon').addEventListener('click', ()=>openDeck('doon'));
$('deck-kousei').addEventListener('click', ()=>openDeck('kousei'));
$('deck-yomi').addEventListener('click', ()=>openDeck('yomi'));
$('deck-keigo').addEventListener('click', ()=>openDeck('keigo'));

load();
renderHome();
checkUpdate();
</script>
